x-go-common: &go-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    NS_DATABASE_DSN: "postgres://notif:notif@postgres:5432/notifdb?sslmode=disable"
    NS_REDIS_ADDR: "redis:6379"
    NS_PUBSUB_MODE: "mock"
    NS_LOG_FORMAT: "console"
    NS_LOG_LEVEL: "debug"
    NS_SERVER_MODE: "debug"
    # Temporal runs as a separate container; never use 127.0.0.1 here.
    NS_CADENCE_HOST_PORT: "temporal:7233"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    temporal:
      condition: service_started
  volumes:
    - ./api/config:/config:ro
    - ./api/migrations:/migrations:ro

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
      POSTGRES_DB: notifdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d notifdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  redpanda:
    image: redpandadata/redpanda:latest
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8083
      - --advertise-pandaproxy-addr=localhost:8083
    ports:
      - "9092:9092"   # Kafka protocol (external)
      - "29092:29092" # Kafka protocol (internal Docker network)
      - "8083:8083"   # Pandaproxy REST
      - "9644:9644"   # Admin API / metrics
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redpanda-console:
    image: redpandadata/console:latest
    restart: unless-stopped
    ports:
      - "8084:8080"
    environment:
      - KAFKA_BROKERS=redpanda:29092
    depends_on:
      redpanda:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:1.24.2
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - SQL_ADDR=postgres
      - POSTGRES_USER=notif
      - POSTGRES_PWD=notif
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal

  # ── Application ─────────────────────────────────────────────────────────────
  api:
    <<: *go-common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api
    ports:
      - "8080:8080"
    environment:
      NS_DATABASE_DSN: "postgres://notif:notif@postgres:5432/notifdb?sslmode=disable"
      NS_REDIS_ADDR: "redis:6379"
      # Switch to "kafka" to enable Kafka-backed priority queuing.
      NS_PUBSUB_MODE: "mock"
      NS_PUBSUB_KAFKA_BROKERS: "redpanda:29092"
      NS_CADENCE_HOST_PORT: "temporal:7233"
      NS_LOG_FORMAT: "console"
      NS_LOG_LEVEL: "debug"
      NS_SERVER_MODE: "debug"
      NS_PROVIDERS_EMAIL_SMTP_HOST: "mailhog"
      NS_PROVIDERS_EMAIL_SMTP_PORT: "1025"
      NS_JWT_SECRET: "change-me-in-production"
      NS_WORKER_INTERNAL_URL: "http://worker:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *go-common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: worker
    ports:
      - "8081:8081"
    environment:
      NS_DATABASE_DSN: "postgres://notif:notif@postgres:5432/notifdb?sslmode=disable"
      NS_REDIS_ADDR: "redis:6379"
      # Switch to "kafka" to enable Kafka-backed priority queuing.
      NS_PUBSUB_MODE: "mock"
      NS_PUBSUB_KAFKA_BROKERS: "redpanda:29092"
      NS_CADENCE_HOST_PORT: "temporal:7233"
      NS_LOG_FORMAT: "console"
      NS_LOG_LEVEL: "debug"
      NS_PROVIDERS_EMAIL_SMTP_HOST: "mailhog"
      NS_PROVIDERS_EMAIL_SMTP_PORT: "1025"
    depends_on:
      api:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
