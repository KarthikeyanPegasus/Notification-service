x-go-common: &go-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    NS_DATABASE_DSN: "postgres://notif:notif@postgres:5432/notifdb?sslmode=disable"
    NS_REDIS_ADDR: "redis:6379"
    # Default to mock unless explicitly overridden (e.g. NS_PUBSUB_MODE=kafka).
    NS_PUBSUB_MODE: ${NS_PUBSUB_MODE:-mock}
    NS_PUBSUB_KAFKA_BROKERS: ${NS_PUBSUB_KAFKA_BROKERS:-redpanda:29092}
    NS_LOG_FORMAT: "console"
    NS_LOG_LEVEL: ${NS_LOG_LEVEL:-info}
    NS_SERVER_MODE: ${NS_SERVER_MODE:-release}
    # Guards debug mode — API fatally rejects debug in production/staging.
    ENVIRONMENT: ${ENVIRONMENT:-development}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    redpanda:
      condition: service_healthy
  volumes:
    - ./api/config:/config:ro
    - ./api/migrations:/migrations:ro

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
      POSTGRES_DB: notifdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d notifdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:latest
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8083
      - --advertise-pandaproxy-addr=localhost:8083
    ports:
      - "9092:9092"   # Kafka protocol (external)
      - "29092:29092" # Kafka protocol (internal Docker network)
      - "8083:8083"   # Pandaproxy REST
      - "9644:9644"   # Admin API / metrics
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redpanda-console:
    image: redpandadata/console:latest
    restart: unless-stopped
    ports:
      - "8084:8080"
    environment:
      - KAFKA_BROKERS=redpanda:29092
    depends_on:
      redpanda:
        condition: service_healthy

  # Create required topics for NotifyHub priority queues.
  # This runs once at startup and is safe to re-run (topics are created if missing).
  redpanda-init:
    image: redpandadata/redpanda:latest
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        echo "Creating NotifyHub topics (if missing)..."
        brokers="redpanda:29092"
        rpk topic create internal-config-reload --brokers "$${brokers}" --partitions 3 --replicas 1 || true
        rpk topic create notifications-dlq         --brokers "$${brokers}" --partitions 3 --replicas 1 || true
        rpk topic create notifications-email-high   --brokers "$${brokers}" --partitions 6 --replicas 1 || true
        rpk topic create notifications-email-medium --brokers "$${brokers}" --partitions 6 --replicas 1 || true
        rpk topic create notifications-email-low    --brokers "$${brokers}" --partitions 6 --replicas 1 || true
        rpk topic create notifications-sms-high     --brokers "$${brokers}" --partitions 6 --replicas 1 || true
        rpk topic create notifications-sms-medium   --brokers "$${brokers}" --partitions 6 --replicas 1 || true
        rpk topic create notifications-sms-low      --brokers "$${brokers}" --partitions 6 --replicas 1 || true
        rpk topic create notifications-push-high    --brokers "$${brokers}" --partitions 6 --replicas 1 || true
        rpk topic create notifications-push-medium  --brokers "$${brokers}" --partitions 6 --replicas 1 || true
        rpk topic create notifications-push-low     --brokers "$${brokers}" --partitions 6 --replicas 1 || true
        rpk topic create notifications-webhook-high   --brokers "$${brokers}" --partitions 6 --replicas 1 || true
        rpk topic create notifications-webhook-medium --brokers "$${brokers}" --partitions 6 --replicas 1 || true
        rpk topic create notifications-webhook-low    --brokers "$${brokers}" --partitions 6 --replicas 1 || true
        rpk topic create notifications-slack-high   --brokers "$${brokers}" --partitions 3 --replicas 1 || true
        rpk topic create notifications-slack-medium --brokers "$${brokers}" --partitions 3 --replicas 1 || true
        rpk topic create notifications-slack-low    --brokers "$${brokers}" --partitions 3 --replicas 1 || true
        rpk topic create notifications-websocket-high   --brokers "$${brokers}" --partitions 3 --replicas 1 || true
        rpk topic create notifications-websocket-medium --brokers "$${brokers}" --partitions 3 --replicas 1 || true
        rpk topic create notifications-websocket-low    --brokers "$${brokers}" --partitions 3 --replicas 1 || true
        echo "Topic init done."

  # ── SpamAssassin ────────────────────────────────────────────────────────────
  # Content filter for email spam detection. The API degrades gracefully if this
  # service is unreachable (warns and skips the check).
  spamassassin:
    image: ghcr.io/mailserver2/spamassassin:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:783:783"

  # ── Application ─────────────────────────────────────────────────────────────
  api:
    <<: *go-common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api
    ports:
      - "8080:8080"
    environment:
      NS_DATABASE_DSN: ${NS_DATABASE_DSN:-postgres://notif:notif@postgres:5432/notifdb?sslmode=disable}
      NS_REDIS_ADDR: "redis:6379"
      NS_PUBSUB_MODE: "kafka"
      NS_PUBSUB_KAFKA_BROKERS: "redpanda:29092"
      NS_LOG_FORMAT: "console"
      NS_LOG_LEVEL: ${NS_LOG_LEVEL:-info}
      NS_SERVER_MODE: ${NS_SERVER_MODE:-release}
      NS_JWT_SECRET: ${NS_JWT_SECRET:-}
      NS_JWT_SERVICE_SECRET: ${NS_JWT_SERVICE_SECRET:-}
      NS_CLERK_SECRET_KEY: ${NS_CLERK_SECRET_KEY:-}
      NS_CLERK_WEBHOOK_SECRET: ${NS_CLERK_WEBHOOK_SECRET:-}
      NS_WORKER_INTERNAL_URL: "http://worker:8081"
      ENVIRONMENT: ${ENVIRONMENT:-development}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *go-common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: worker
    ports:
      - "8081:8081"
    environment:
      NS_DATABASE_DSN: ${NS_DATABASE_DSN:-postgres://notif:notif@postgres:5432/notifdb?sslmode=disable}
      NS_REDIS_ADDR: "redis:6379"
      NS_PUBSUB_MODE: "kafka"
      NS_PUBSUB_KAFKA_BROKERS: "redpanda:29092"
      NS_LOG_FORMAT: "console"
      NS_LOG_LEVEL: ${NS_LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      api:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
