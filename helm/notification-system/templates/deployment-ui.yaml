{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notification-system.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notification-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  {{- if not .Values.ui.autoscaling.enabled }}
  replicas: {{ .Values.ui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "notification-system.componentLabels" (list . "ui") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.ui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "notification-system.componentLabels" (list . "ui") | nindent 8 }}
        {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "notification-system.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.ui.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: {{ include "notification-system.image" (list . .Values.image.ui) }}
          imagePullPolicy: {{ .Values.image.ui.pullPolicy }}
          securityContext:
            {{- toYaml .Values.ui.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.service.port }}
              protocol: TCP
          envFrom:
            # UI server needs CLERK_SECRET_KEY for server-side Clerk middleware.
            # Only the relevant Clerk keys are in the shared Secret — other keys are harmless.
            - secretRef:
                name: {{ include "notification-system.secretName" . }}
          env:
            # Next.js reads NEXT_PUBLIC_API_URL at build time and at SSR time.
            # For in-cluster use the API service address; for browser requests the
            # ingress/LB URL must be supplied so browser fetch() can reach the API.
            - name: NEXT_PUBLIC_API_URL
              value: {{ default (include "notification-system.workerInternalUrl" . | replace "-worker" "-api") .Values.ui.apiUrl | quote }}
            - name: PORT
              value: {{ .Values.ui.service.port | quote }}
            {{- if .Values.ui.clerkPublishableKey }}
            - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
              value: {{ .Values.ui.clerkPublishableKey | quote }}
            {{- end }}
            {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.ui.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.ui.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
