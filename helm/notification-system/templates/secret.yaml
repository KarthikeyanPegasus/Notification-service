{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notification-system.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notification-system.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ── Core ──────────────────────────────────────────────────────────────────
  NS_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- if .Values.secrets.jwtServiceSecret }}
  NS_JWT_SERVICE_SECRET: {{ .Values.secrets.jwtServiceSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.vendorConfigEncryptionKey }}
  NS_SECURITY_VENDOR_CONFIG_ENCRYPTION_KEY: {{ .Values.secrets.vendorConfigEncryptionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.adminPassword }}
  NS_ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  {{- end }}

  # ── Clerk ─────────────────────────────────────────────────────────────────
  {{- if .Values.secrets.clerkSecretKey }}
  NS_CLERK_SECRET_KEY: {{ .Values.secrets.clerkSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.clerkWebhookSecret }}
  NS_CLERK_WEBHOOK_SECRET: {{ .Values.secrets.clerkWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.clerkJwksUrl }}
  NS_CLERK_JWKS_URL: {{ .Values.secrets.clerkJwksUrl | quote }}
  {{- end }}

  # ── Email — SMTP ──────────────────────────────────────────────────────────
  {{- if .Values.secrets.smtpUsername }}
  NS_PROVIDERS_EMAIL_SMTP_USERNAME: {{ .Values.secrets.smtpUsername | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpPassword }}
  NS_PROVIDERS_EMAIL_SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  {{- end }}

  # ── Email — AWS SES ───────────────────────────────────────────────────────
  {{- if .Values.secrets.sesAccessKeyId }}
  NS_PROVIDERS_EMAIL_SES_ACCESS_KEY_ID: {{ .Values.secrets.sesAccessKeyId | quote }}
  {{- end }}
  {{- if .Values.secrets.sesSecretAccessKey }}
  NS_PROVIDERS_EMAIL_SES_SECRET_ACCESS_KEY: {{ .Values.secrets.sesSecretAccessKey | quote }}
  {{- end }}

  # ── Email — Mailgun ───────────────────────────────────────────────────────
  {{- if .Values.secrets.mailgunDomain }}
  NS_PROVIDERS_EMAIL_MAILGUN_DOMAIN: {{ .Values.secrets.mailgunDomain | quote }}
  {{- end }}
  {{- if .Values.secrets.mailgunApiKey }}
  NS_PROVIDERS_EMAIL_MAILGUN_API_KEY: {{ .Values.secrets.mailgunApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.mailgunFrom }}
  NS_PROVIDERS_EMAIL_MAILGUN_FROM: {{ .Values.secrets.mailgunFrom | quote }}
  {{- end }}

  # ── Email — SendGrid ──────────────────────────────────────────────────────
  {{- if .Values.secrets.sendgridApiKey }}
  NS_PROVIDERS_EMAIL_SENDGRID_API_KEY: {{ .Values.secrets.sendgridApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.sendgridFromEmail }}
  NS_PROVIDERS_EMAIL_SENDGRID_FROM_EMAIL: {{ .Values.secrets.sendgridFromEmail | quote }}
  {{- end }}
  {{- if .Values.secrets.sendgridFromName }}
  NS_PROVIDERS_EMAIL_SENDGRID_FROM_NAME: {{ .Values.secrets.sendgridFromName | quote }}
  {{- end }}
  {{- if .Values.secrets.sendgridReplyTo }}
  NS_PROVIDERS_EMAIL_SENDGRID_REPLY_TO: {{ .Values.secrets.sendgridReplyTo | quote }}
  {{- end }}

  # ── Email — Postmark ──────────────────────────────────────────────────────
  {{- if .Values.secrets.postmarkServerToken }}
  NS_PROVIDERS_EMAIL_POSTMARK_SERVER_TOKEN: {{ .Values.secrets.postmarkServerToken | quote }}
  {{- end }}
  {{- if .Values.secrets.postmarkFromEmail }}
  NS_PROVIDERS_EMAIL_POSTMARK_FROM_EMAIL: {{ .Values.secrets.postmarkFromEmail | quote }}
  {{- end }}
  {{- if .Values.secrets.postmarkFromName }}
  NS_PROVIDERS_EMAIL_POSTMARK_FROM_NAME: {{ .Values.secrets.postmarkFromName | quote }}
  {{- end }}
  {{- if .Values.secrets.postmarkReplyTo }}
  NS_PROVIDERS_EMAIL_POSTMARK_REPLY_TO: {{ .Values.secrets.postmarkReplyTo | quote }}
  {{- end }}

  # ── Email — Mailgun extras ────────────────────────────────────────────────
  {{- if .Values.secrets.mailgunWebhookSigningKey }}
  NS_PROVIDERS_EMAIL_MAILGUN_WEBHOOK_SIGNING_KEY: {{ .Values.secrets.mailgunWebhookSigningKey | quote }}
  {{- end }}
  {{- if .Values.secrets.mailgunReplyTo }}
  NS_PROVIDERS_EMAIL_MAILGUN_REPLY_TO: {{ .Values.secrets.mailgunReplyTo | quote }}
  {{- end }}

  # ── SMS — Twilio ──────────────────────────────────────────────────────────
  {{- if .Values.secrets.twilioAccountSid }}
  NS_PROVIDERS_SMS_TWILIO_ACCOUNT_SID: {{ .Values.secrets.twilioAccountSid | quote }}
  {{- end }}
  {{- if .Values.secrets.twilioAuthToken }}
  NS_PROVIDERS_SMS_TWILIO_AUTH_TOKEN: {{ .Values.secrets.twilioAuthToken | quote }}
  {{- end }}
  {{- if .Values.secrets.twilioFromNumber }}
  NS_PROVIDERS_SMS_TWILIO_FROM_NUMBER: {{ .Values.secrets.twilioFromNumber | quote }}
  {{- end }}

  # ── SMS — Plivo ───────────────────────────────────────────────────────────
  {{- if .Values.secrets.plivoAuthId }}
  NS_PROVIDERS_SMS_PLIVO_AUTH_ID: {{ .Values.secrets.plivoAuthId | quote }}
  {{- end }}
  {{- if .Values.secrets.plivoAuthToken }}
  NS_PROVIDERS_SMS_PLIVO_AUTH_TOKEN: {{ .Values.secrets.plivoAuthToken | quote }}
  {{- end }}
  {{- if .Values.secrets.plivoFromNumber }}
  NS_PROVIDERS_SMS_PLIVO_FROM_NUMBER: {{ .Values.secrets.plivoFromNumber | quote }}
  {{- end }}

  # ── SMS — Vonage ──────────────────────────────────────────────────────────
  {{- if .Values.secrets.vonageApiKey }}
  NS_PROVIDERS_SMS_VONAGE_API_KEY: {{ .Values.secrets.vonageApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.vonageApiSecret }}
  NS_PROVIDERS_SMS_VONAGE_API_SECRET: {{ .Values.secrets.vonageApiSecret | quote }}
  {{- end }}

  # ── SMS — MessageBird ─────────────────────────────────────────────────────
  {{- if .Values.secrets.messagebirdAccessKey }}
  NS_PROVIDERS_SMS_MESSAGEBIRD_ACCESS_KEY: {{ .Values.secrets.messagebirdAccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.messagebirdOriginator }}
  NS_PROVIDERS_SMS_MESSAGEBIRD_ORIGINATOR: {{ .Values.secrets.messagebirdOriginator | quote }}
  {{- end }}

  # ── Push — FCM ────────────────────────────────────────────────────────────
  {{- if .Values.secrets.fcmServiceAccountJson }}
  NS_PROVIDERS_PUSH_FCM_SERVICE_ACCOUNT_JSON: {{ .Values.secrets.fcmServiceAccountJson | quote }}
  {{- end }}

  # ── Push — OneSignal ──────────────────────────────────────────────────────
  {{- if .Values.secrets.onesignalAppId }}
  NS_PROVIDERS_PUSH_ONESIGNAL_APP_ID: {{ .Values.secrets.onesignalAppId | quote }}
  {{- end }}
  {{- if .Values.secrets.onesignalRestApiKey }}
  NS_PROVIDERS_PUSH_ONESIGNAL_REST_API_KEY: {{ .Values.secrets.onesignalRestApiKey | quote }}
  {{- end }}

  # ── Push — Pusher Beams ───────────────────────────────────────────────────
  {{- if .Values.secrets.pusherInstanceId }}
  NS_PROVIDERS_PUSH_PUSHER_INSTANCE_ID: {{ .Values.secrets.pusherInstanceId | quote }}
  {{- end }}
  {{- if .Values.secrets.pusherSecretKey }}
  NS_PROVIDERS_PUSH_PUSHER_SECRET_KEY: {{ .Values.secrets.pusherSecretKey | quote }}
  {{- end }}

  # ── Push — APNs ───────────────────────────────────────────────────────────
  {{- if .Values.secrets.apnsKeyId }}
  NS_PROVIDERS_PUSH_APNS_KEY_ID: {{ .Values.secrets.apnsKeyId | quote }}
  {{- end }}
  {{- if .Values.secrets.apnsTeamId }}
  NS_PROVIDERS_PUSH_APNS_TEAM_ID: {{ .Values.secrets.apnsTeamId | quote }}
  {{- end }}
  {{- if .Values.secrets.apnsBundleId }}
  NS_PROVIDERS_PUSH_APNS_BUNDLE_ID: {{ .Values.secrets.apnsBundleId | quote }}
  {{- end }}

  # ── Webhook ───────────────────────────────────────────────────────────────
  {{- if .Values.secrets.webhookSigningSecret }}
  NS_PROVIDERS_WEBHOOK_SIGNING_SECRET: {{ .Values.secrets.webhookSigningSecret | quote }}
  {{- end }}

  # ── Slack ─────────────────────────────────────────────────────────────────
  {{- if .Values.secrets.slackWebhookUrl }}
  NS_PROVIDERS_SLACK_WEBHOOK_URL: {{ .Values.secrets.slackWebhookUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.slackDefaultUsername }}
  NS_PROVIDERS_SLACK_DEFAULT_USERNAME: {{ .Values.secrets.slackDefaultUsername | quote }}
  {{- end }}
  {{- if .Values.secrets.slackChannels }}
  NS_PROVIDERS_SLACK_CHANNELS: {{ .Values.secrets.slackChannels | quote }}
  {{- end }}

  # ── Pushwoosh ─────────────────────────────────────────────────────────────
  {{- if .Values.secrets.pushwooshApplicationCode }}
  NS_PROVIDERS_PUSH_PUSHWOOSH_APPLICATION_CODE: {{ .Values.secrets.pushwooshApplicationCode | quote }}
  {{- end }}
  {{- if .Values.secrets.pushwooshApiAccessToken }}
  NS_PROVIDERS_PUSH_PUSHWOOSH_API_ACCESS_TOKEN: {{ .Values.secrets.pushwooshApiAccessToken | quote }}
  {{- end }}

  # ── External Redis password ───────────────────────────────────────────────
  {{- if .Values.externalRedis.password }}
  NS_REDIS_PASSWORD: {{ .Values.externalRedis.password | quote }}
  {{- end }}
{{- end }}
