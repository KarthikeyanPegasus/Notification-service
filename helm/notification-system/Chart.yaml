apiVersion: v2
name: notification-system
description: Production-ready Helm chart for the notification service (API, Worker, UI)
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - notification
  - kafka
  - temporal
  - messaging
maintainers:
  - name: karthikeyan
home: https://github.com/spidey/notification-service
dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "19.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
