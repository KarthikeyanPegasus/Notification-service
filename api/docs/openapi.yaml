        '401':
          description: Unauthorized
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create an API key
      description: Admin-only. Creates a new API key client. The raw key is returned once and cannot be retrieved again.
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { $ref: '#/components/schemas/ApiKeyClient' }
                  api_key: { type: string, description: The raw API key. Store it securely — it will not be shown again. }
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/api-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
